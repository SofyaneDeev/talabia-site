body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);min-height:100vh;padding-bottom:110px}
body.ar{--body:"Cairo",ui-sans-serif,system-ui,sans-serif;--display:"Cairo",ui-sans-serif,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

header .wrap{position:relative;display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.av{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font:700 22px var(--display)}

h1{font:700 26px/1.2 var(--display);margin:8px 0 0;letter-spacing:-.01em}
.sub{opacity:.88;margin:0;font-size:14px}
.search{margin:16px 0 4px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:1;width:100%;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font:700 34px var(--display);color:var(--accent)}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb b{font-size:14.5px;line-height:1.3;text-align:start;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}
.price{font:700 16px var(--display);color:var(--accent);direction:ltr;text-align:start}
body.ar .price{text-align:right}
.out{font-size:12px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:6px;padding:2px 8px;align-self:flex-start}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;min-height:32px}

.bar .go{width:auto}.go svg,.walink svg{width:20px;height:20px;flex:none}.go:disabled{opacity:.6;cursor:wait}

.err{color:var(--red);font-weight:700;font-size:14px;margin:0;background:var(--red-soft);border-radius:10px;padding:8px 10px}

.done p{margin:0;color:var(--muted)}.done .ref{color:var(--ink)}.done .line{text-align:start}

.sheet .in{background:var(--surface);width:100%;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}

.line{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.line:first-of-type{border-top:0}
.line .n{flex:1;min-width:0}.line .n small{display:block;color:var(--muted);direction:ltr;text-align:start}
body.ar .line .n small{text-align:right}
.line .qty{margin:0;width:116px;flex:none}.line .qty button{width:36px;min-height:36px;font-size:17px}
label{font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
label input{border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;font-size:16px;font-weight:500;color:var(--ink);background:var(--surface)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:700;min-height:44px}
footer{text-align:center;margin:28px 0 10px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent);font-weight:700;text-decoration:none}
footer a i{font-style:normal;color:var(--gold)}

.privn{margin:8px 0 0;font-size:12.5px;color:var(--mut,#64685f)}.privn a{color:inherit}
</style>
</head>

 return `<div class="card" data-e="${esc(e.id)}">${img?`<img class="ph" src="${esc(img)}" alt="" loading="lazy">`:`<div class="ph" aria-hidden="true">${esc((e.name.trim()[0]||"?").toUpperCase())}</div>`}
 <div class="cb"><b dir="auto">${esc(e.name)}</b><div class="price">${it?dh(it.p):priceOf(e)}</div>
 ${e.kind==="grp"?`<div class="opts" role="group" aria-label="${esc(e.name)}">${e.items.map(i=>`<button type="button" class="opt" dir="auto" data-pick="${esc(e.id)}" data-id="${esc(i.id)}" aria-pressed="${!!it&&it.id===i.id}" ${i.out?"disabled":""}>${ownImg(e,i)?`<img class="ot" src="${esc(ownImg(e,i))}" alt="" loading="lazy">`:""}${esc(i.o||i.n)}</button>`).join("")}</div>`:""}
 ${allOut||(it&&it.out)?`<span class="out">${esc(T().out)}</span>`:""}
 ${q?`<div class="qty"><button type="button" data-dec="${esc(it.id)}" aria-label="−">−</button><span>${q}</span><button type="button" data-inc="${esc(it.id)}" aria-label="+">+</button></div>`
   :`<button type="button" class="add" data-add="${esc(e.id)}" ${allOut||(it&&it.out)||(e.kind==="grp"&&!it)?"disabled":""}>${esc(e.kind==="grp"&&!it?"↑ "+e.items.map(i=>i.o).filter(Boolean).slice(0,2).join(" / ")+(e.items.length>2?"…":""):T().add)}</button>`}
 </div></div>`}

function draw(){
 const q=query.trim().toLowerCase(),list=q?entries.filter(e=>(e.name+" "+e.items.map(i=>i.o||"").join(" ")).toLowerCase().includes(q)):entries;
 $("main").innerHTML=`${entries.length>6?`<div class="search"><input type="search" id="q" value="${esc(query)}" placeholder="${esc(T().search)}" aria-label="${esc(T().search)}"></div>`:""}
  ${entries.length?(list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">${esc(T().noMatch)}</div>`):`<div class="empty">${esc(T().none)}</div>`}
  <footer>${esc(T().made)} <a href="../" target="_blank" rel="noopener" dir="ltr">Talabia<i>.</i></a> · <a href="../privacy.html" target="_blank" rel="noopener">${esc(T().privL)}</a></footer>`;
 drawBar()}
function redrawCard(eid){const e=entries.find(x=>x.id===eid),el=document.querySelector(`.card[data-e="${CSS.escape(eid)}"]`);if(e&&el)el.outerHTML=card(e);drawBar()}
function drawBar(){const ls=cartLines(),n=ls.reduce((a,x)=>a+x.q,0),tot=ls.reduce((a,x)=>a+x.q*x.it.p,0);
 $("bar").hidden=!n;$("total").textContent=dh(tot);$("count").textContent=T().items(n);$("review").innerHTML=CART_ICON+esc(T().order);store.set("talabia-cart-"+slug,cart)}
const entryOf=id=>{const it=byId(id);return it?(it.g||it.id):null};
function setQ(id,q){if(q>0)cart[id]=Math.min(99,q);else delete cart[id]}

function openSheet(){const ls=cartLines();if(!ls.length)return;const me=store.get("talabia-me")||{};
 const tot=ls.reduce((a,x)=>a+x.q*x.it.p,0);
 $("sheetIn").innerHTML=`<h2 id="sheetTitle">${esc(T().yourOrder)}</h2>
  ${ls.map(x=>`<div class="line"><div class="n"><b dir="auto">${esc(x.it.n)}</b><small>${x.q} × ${dh(x.it.p)}</small></div><div class="qty"><button type="button" data-sdec="${esc(x.it.id)}" aria-label="−">−</button><span>${x.q}</span><button type="button" data-sinc="${esc(x.it.id)}" aria-label="+">+</button></div></div>`).join("")}
  <div class="line"><div class="n"><b>${esc(T().total)}</b></div><b class="price">${dh(tot)} <small style="font:500 12px var(--body);color:var(--muted)">${esc(T().delivery)}</small></b></div>
  <label>${esc(T().name)} *<input id="fn" autocomplete="name" value="${esc(me.n||"")}"></label>
  <label>${esc(T().phone)} *<input id="fp" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="06…" value="${esc(me.p||"")}"></label>
  <label>${esc(T().city)} *<input id="fc" autocomplete="address-level2" value="${esc(me.c||"")}"></label>
  <label>${esc(T().address)}<input id="fa" autocomplete="street-address" value="${esc(me.a||"")}"></label>
  <label>${esc(T().note)}<textarea id="fo" rows="2" placeholder="${esc(T().notePh)}">${esc(me.o||"")}</textarea></label>
  <p class="hint">${esc(T().optional)}</p>
  ${ordErr?`<p class="err" role="alert">${esc(ordErr)}</p>`:""}
  <p class="privn">${esc(T().privN)} <a href="../privacy.html#customers" target="_blank" rel="noopener">${esc(T().privL)}</a></p>
  <button type="button" class="go" id="sendOrder" ${ordBusy?"disabled":""}>${CART_ICON}${esc(ordBusy?T().sending:T().sendOrder)}</button>
  <a class="walink" id="send" href="#" target="_blank" rel="noopener">${WA_ICON}${esc(T().send)}</a>
  <button type="button" class="ghost" id="close">${esc(T().back)}</button>`;
 $("sheet").hidden=false;document.body.style.overflow="hidden";updateLink()}
function closeSheet(){$("sheet").hidden=true;document.body.style.overflow="";ordErr="";draw()}
async function sendOrder(){if(ordBusy)return;updateLink();const me=store.get("talabia-me")||{};ordErr="";
 let ph=String(me.p||"").replace(/\D/g,"");if(ph.startsWith("212"))ph="0"+ph.slice(3);if(ph.length===9&&/^[5-7]/.test(ph))ph="0"+ph;
 if((me.n||"").trim().length<2)ordErr=T().needName;else if(!/^0[5-7]\d{8}$/.test(ph))ordErr=T().needPhone;else if((me.c||"").trim().length<2)ordErr=T().needCity;
 if(ordErr){openSheet();return}
 ordBusy=true;openSheet();
 try{const r=await fetch(API+"/rest/v1/rpc/place_catalog_order",{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},
   body:JSON.stringify({p_slug:slug,p_items:cartLines().map(x=>({id:x.it.id,q:x.q})),p_name:me.n,p_phone:ph,p_city:me.c,p_address:me.a||"",p_note:(me.o||"").trim(),p_src:FROM})});
  const j=await r.json().catch(()=>null);
  if(!r.ok){const m=String((j&&j.message)||"");ordErr=/too many/.test(m)?T().tooMany:/no available|closed/.test(m)?T().gone:/phone/.test(m)?T().needPhone:/name/.test(m)?T().needName:/city/.test(m)?T().needCity:T().failed;ordBusy=false;openSheet();return}
  const ls=cartLines(),tot=ls.reduce((a,x)=>a+x.q*x.it.p,0);
  cart={};store.set("talabia-cart-"+slug,cart);me.o="";store.set("talabia-me",me);ordBusy=false;
  $("sheetIn").innerHTML=`<div class="done"><div class="ok" aria-hidden="true">✓</div><h2 id="sheetTitle">${esc(T().doneT)}</h2><p>${esc(T().doneP)}</p>
   <p class="ref">${esc(T().ref)} : <b dir="ltr">#${esc(String(j||""))}</b></p>
   ${ls.map(x=>`<div class="line"><div class="n"><b dir="auto">${esc(x.it.n)}</b><small>${x.q} × ${dh(x.it.p)}</small></div></div>`).join("")}
   <div class="line"><div class="n"><b>${esc(T().total)}</b></div><b class="price">${dh(tot)}</b></div>
   <button type="button" class="go" id="close">${esc(T().close)}</button></div>`;
  drawBar()}
 catch(e){ordBusy=false;ordErr=T().failed;openSheet()}}
function updateLink(){const ls=cartLines(),a=$("send");if(!a)return;const v=id=>($(id).value||"").trim().slice(0,120);
 const me={n:v("fn"),p:v("fp").replace(/[^\d+ ]/g,"").slice(0,16),c:v("fc"),a:v("fa"),o:($("fo")?$("fo").value:"").slice(0,300)};store.set("talabia-me",me);
 const lines=ls.map(x=>`• ${x.it.n} × ${x.q} = ${num(x.q*x.it.p)} DH`).join("\n"),tot=ls.reduce((s,x)=>s+x.q*x.it.p,0);
 const text=T().msg(CAT.shop,lines,num(tot),me.n,me.p,me.c,me.a)+(me.o.trim()?"\n📝 "+me.o.trim():"");
 a.href="https://wa.me/212"+CAT.wa.slice(1)+"?text="+encodeURIComponent(text)}

document.addEventListener("click",ev=>{const b=ev.target.closest("button,a");if(!b)return;const d=b.dataset;
 if(d.lang){L=d.lang;store.set("talabia-cat-lang",L);applyLang();if(CAT){if($("sheet").hidden)draw();else openSheet()}else load();return}
 if(b.id==="retry"){load();return}
 if(d.pick){pick[d.pick]=d.id;redrawCard(d.pick);return}
 if(d.add){const e=entries.find(x=>x.id===d.add),it=e&&chosen(e);if(it&&!it.out){setQ(it.id,(cart[it.id]||0)+1);redrawCard(e.id)}return}
 if(d.inc||d.dec){const id=d.inc||d.dec;setQ(id,(cart[id]||0)+(d.inc?1:-1));redrawCard(entryOf(id));return}
 if(d.sinc||d.sdec){const id=d.sinc||d.sdec;setQ(id,(cart[id]||0)+(d.sinc?1:-1));drawBar();if(cartLines().length)openSheet();else closeSheet();return}
 if(b.id==="review"){openSheet();return}
 if(b.id==="close"){closeSheet();return}
 if(b.id==="sendOrder"){sendOrder();return}
 if(b.id==="send"){updateLink();setTimeout(()=>{cart={};store.set("talabia-cart-"+slug,cart);closeSheet()},400);return}
});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){query=ev.target.value;const pos=ev.target.selectionStart;draw();const i=$("q");if(i){i.focus();i.setSelectionRange(pos,pos)}}
 else if(["fn","fp","fc","fa","fo"].includes(ev.target.id)){updateLink();if(ordErr){ordErr="";const e=document.querySelector(".err");if(e)e.remove()}}});
$("sheet").addEventListener("click",ev=>{if(ev.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!$("sheet").hidden)closeSheet()});
load();
</script>
</body>
</html>
